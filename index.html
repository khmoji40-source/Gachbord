
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GACHBORD</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:tahoma;
background:#f4f8fc;
color:#222;
}

header{
background:linear-gradient(135deg,#4facfe,#00c6ff);
padding:60px 20px;
text-align:center;
color:white;
}

header h1{
font-size:48px;
}

header p{
margin-top:10px;
font-size:18px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:30px;
margin-top:-40px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
margin-bottom:15px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#00a8ff;
color:white;
text-decoration:none;
border-radius:10px;
}

.services{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.service{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
}

footer{
margin-top:50px;
padding:25px;
text-align:center;
background:white;
}
</style>
</head>

<body>

<header>
<h1>GACHBORD</h1>
<p>پلتفرم گچکاران ایران</p>
</header>

<div class="container">

<div class="card">
<h2>مجتبی - مریوان</h2>
<p>25 سال سابقه کاری</p>
<p>گچ و خاک، سفیدکاری، طرح و ابزار، انواع شبکه</p>
<a class="btn" href="#">تماس با مجتبی</a>
</div>

<div class="services">
<div class="service">گچ و خاک</div>
<div class="service">سفیدکاری</div>
<div class="service">طرح و ابزار</div>
<div class="service">انواع شبکه</div>
</div>

</div>

<footer>
GACH
